[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rime"
version = "0.1.0"
description = "Crystalline zero-dependency terminal UI, ANSI styling, panels, and interactive menu engine"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["terminal", "tui", "cli", "ansi", "spinner", "panel", "menu", "nixos", "frost", "iceberg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Terminals",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[project.scripts]
rime = "rime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rime*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
