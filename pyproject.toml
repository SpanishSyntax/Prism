[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "Crystalline zero-dependency terminal UI, ANSI styling, panels, and interactive menu engine"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["terminal", "tui", "cli", "ansi", "spinner", "panel", "menu", "nixos", "frost", "iceberg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Terminals",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/ui.py" = ["F401"]
"**/ui/*.py" = ["F401"]
"**/ui/__init__.py" = ["F401"]
"**/tests/*" = ["F401", "F841"]
